<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aurora — TV Launcher</title>
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --bg-0:#07070b;
    --bg-1:#0d0e15;
    --ink:#f4f5fb;
    --ink-dim:#9aa0b4;
    --ink-faint:#5b6075;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.10);
    --stroke:rgba(255,255,255,0.10);
    --stroke-bright:rgba(255,255,255,0.22);
    --accent:#7aa2ff;
    --accent-2:#43e0c8;
    --focus:#ffffff;
    --radius:24px;
    --safe: 2.7vw;           /* overscan-safe gutter */
    --tile: 15.5vw;          /* app tile size */
    --ease:cubic-bezier(.2,.7,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:"Inter","SF Pro Display",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.2px;
    user-select:none;
  }

  /* ---------- Ambient background ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
      radial-gradient(1200px 800px at 15% -10%, #16213f 0%, transparent 55%),
      radial-gradient(1100px 820px at 100% 0%, #1b2e38 0%, transparent 50%),
      linear-gradient(180deg,var(--bg-1),var(--bg-0) 70%);}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
  .blob.a{width:46vw;height:46vw;left:-8vw;top:-12vw;background:radial-gradient(circle,#2b4cff55,transparent 60%);animation:drift1 26s var(--ease) infinite alternate}
  .blob.b{width:40vw;height:40vw;right:-10vw;top:-6vw;background:radial-gradient(circle,#19b89b4d,transparent 60%);animation:drift2 32s var(--ease) infinite alternate}
  .grain{position:absolute;inset:0;opacity:.04;background-image:radial-gradient(#fff 0.5px,transparent 0.6px);background-size:3px 3px;mix-blend-mode:overlay}
  @keyframes drift1{to{transform:translate3d(6vw,4vw,0) scale(1.1)}}
  @keyframes drift2{to{transform:translate3d(-5vw,6vw,0) scale(1.08)}}

  /* ---------- Shell ---------- */
  .wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
        padding:var(--safe) var(--safe) 1.4vw;}

  /* ---------- Top bar ---------- */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2vw}
  .clock{line-height:.92}
  .time{font-size:6.3vw;font-weight:800;letter-spacing:-1px;
        background:linear-gradient(180deg,#fff,#c7cce6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .time .ampm{font-size:2.4vw;font-weight:700;color:var(--ink-dim);margin-left:.6vw;-webkit-text-fill-color:var(--ink-dim)}
  .date{margin-top:.4vw;font-size:1.7vw;font-weight:600;color:var(--ink-dim)}

  .weather{display:flex;align-items:center;gap:1.1vw;background:var(--glass);
           border:1px solid var(--stroke);border-radius:var(--radius);
           padding:1.3vw 1.8vw;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
           min-width:19vw}
  .weather .ico{font-size:3.6vw;line-height:1;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
  .weather .temp{font-size:3.2vw;font-weight:800;line-height:1}
  .weather .meta{font-size:1.25vw;color:var(--ink-dim);font-weight:600;margin-top:.2vw}
  .weather .city{font-size:1.25vw;color:var(--ink-faint);font-weight:600}

  /* ---------- Sections ---------- */
  .section{margin-top:1.9vw}
  .section h2{font-size:1.25vw;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
              color:var(--ink-faint);margin-bottom:.75vw;padding-left:.2vw}

  /* ---------- App grid ---------- */
  .apps{display:flex;gap:1.5vw}
  .tile{position:relative;width:var(--tile);height:calc(var(--tile)*0.62);border-radius:var(--radius);
        background:var(--glass);border:1px solid var(--stroke);
        backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
        display:flex;flex-direction:column;justify-content:space-between;padding:1.3vw 1.4vw;
        overflow:hidden;cursor:pointer;transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease),background .28s var(--ease)}
  .tile .glow{position:absolute;inset:0;opacity:.0;transition:opacity .28s var(--ease);
              background:radial-gradient(120% 120% at 20% 0%,var(--tglow,#7aa2ff44),transparent 60%)}
  .tile .brand{width:3.4vw;height:3.4vw;border-radius:16px;display:grid;place-items:center;
               font-size:2vw;background:var(--tbg,#ffffff14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .tile .brand svg{width:60%;height:60%}
  .tile .label{font-size:1.5vw;font-weight:700}
  .tile .sub{font-size:1.05vw;color:var(--ink-dim);font-weight:500;margin-top:.1vw}

  /* ---------- Rails ---------- */
  .rail{display:flex;gap:1.3vw;overflow:visible}
  .card{position:relative;width:16.5vw;height:8.4vw;border-radius:20px;overflow:hidden;flex:0 0 auto;
        border:1px solid var(--stroke);cursor:pointer;
        transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
  .card .art{position:absolute;inset:0;background:var(--art,linear-gradient(135deg,#334,#223));}
  .card .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72))}
  .card .ttl{position:absolute;left:1vw;bottom:.85vw;right:1vw;font-size:1.25vw;font-weight:700;
             text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .card .pill{position:absolute;top:.8vw;left:.9vw;font-size:.85vw;font-weight:700;letter-spacing:.08em;
              text-transform:uppercase;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);
              padding:.3vw .7vw;border-radius:999px;color:#fff;backdrop-filter:blur(6px)}

  /* ---------- Focus state (D-pad) ---------- */
  .focusable{outline:none}
  .focusable.foc{transform:translateZ(0) scale(1.08);
                 border-color:var(--stroke-bright);
                 background:var(--glass-strong);
                 box-shadow:0 0 0 .22vw var(--focus), 0 2.4vw 5vw rgba(0,0,0,.55), 0 0 6vw var(--tglow,#7aa2ff66)}
  .tile.foc .glow{opacity:1}
  .card.foc{box-shadow:0 0 0 .22vw var(--focus),0 2.4vw 5vw rgba(0,0,0,.6)}

  /* fallback when backdrop-filter is unsupported (older TV browsers) */
  @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
    .weather,.tile{background:rgba(22,24,34,.82)}
    .tile.foc{background:rgba(32,35,50,.92)}
  }

  .hint{position:fixed;z-index:3;right:var(--safe);bottom:1.4vw;font-size:1vw;color:var(--ink-faint);
        display:flex;gap:1.4vw;align-items:center}
  .hint b{color:var(--ink-dim)}
  .key{display:inline-grid;place-items:center;min-width:1.7vw;height:1.7vw;padding:0 .4vw;border-radius:7px;
       background:var(--glass);border:1px solid var(--stroke);font-size:.95vw;color:var(--ink-dim);margin-right:.35vw}
</style>
</head>
<body>
  <div class="bg"><div class="blob a"></div><div class="blob b"></div><div class="grain"></div></div>

  <div class="wrap">
    <!-- Top bar -->
    <header class="top">
      <div class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date">—</div>
      </div>
      <div class="weather" id="weather">
        <div class="ico" id="wIco">◌</div>
        <div>
          <div class="temp" id="wTemp">—°</div>
          <div class="meta" id="wMeta">Loading weather…</div>
          <div class="city" id="wCity"></div>
        </div>
      </div>
    </header>

    <!-- Apps -->
    <section class="section">
      <h2>Apps</h2>
      <div class="apps" id="apps" data-row="0"></div>
    </section>

    <!-- Rails -->
    <section class="section">
      <h2 id="rail1-title">Favorites</h2>
      <div class="rail" id="rail1" data-row="1"></div>
    </section>

    <section class="section">
      <h2 id="rail2-title">Recently used</h2>
      <div class="rail" id="rail2" data-row="2"></div>
    </section>
  </div>

  <div class="hint">
    <span><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> <b>Navigate</b></span>
    <span><span class="key">OK</span> <b>Open</b></span>
  </div>

<script>
/* =======================================================================
   CONFIG  — edit these lists to change what the launcher shows.
   ======================================================================= */
const CONFIG = {
  // Weather: set your coordinates. Default = Accra, Ghana.
  weather:{ lat:5.5600, lon:-0.2050, city:"Accra", unit:"celsius" },

  // App grid. url = where the tile goes when you press OK.
  apps:[
    { name:"YouTube",  sub:"TV",       url:"https://www.youtube.com/tv",            glyph:"▶",  tint:"#ff4d4d" },
    { name:"Netflix",  sub:"Streaming",url:"https://www.netflix.com",               glyph:"N",  tint:"#e50914" },
    { name:"Prime",    sub:"Video",    url:"https://www.primevideo.com",            glyph:"▷",  tint:"#1fb6ff" },
    { name:"Jellyfin", sub:"Media",    url:"http://jellyfin.local",                 glyph:"⬡",  tint:"#7b61ff" },
    { name:"Spotify",  sub:"Music",    url:"https://open.spotify.com",              glyph:"♫",  tint:"#1ed760" },
    { name:"Browser",  sub:"Web",      url:"https://www.google.com",                glyph:"◎",  tint:"#9aa2ff" },
  ],

  rail1:{ title:"Favorites", items:[
    { title:"YouTube",      url:"https://www.youtube.com/tv",  pill:"App",  art:"linear-gradient(135deg,#ff5f6d,#7a1f2b)" },
    { title:"Netflix",      url:"https://www.netflix.com",     pill:"App",  art:"linear-gradient(135deg,#b00710,#2a0205)" },
    { title:"Prime Video",  url:"https://www.primevideo.com",  pill:"App",  art:"linear-gradient(135deg,#1fb6ff,#0a3a63)" },
    { title:"Spotify",      url:"https://open.spotify.com",    pill:"App",  art:"linear-gradient(135deg,#1ed760,#0b5a2c)" },
    { title:"News",         url:"https://news.google.com",     pill:"Web",  art:"linear-gradient(135deg,#4b6cff,#17224f)" },
  ]},

  rail2:{ title:"Recently used", items:[
    { title:"Google",       url:"https://www.google.com",      pill:"Web",  art:"linear-gradient(135deg,#5b8cff,#1b2a63)" },
    { title:"Maps",         url:"https://maps.google.com",     pill:"Web",  art:"linear-gradient(135deg,#2ec27a,#0e4a34)" },
    { title:"Weather",      url:"https://www.google.com/search?q=weather", pill:"Web", art:"linear-gradient(135deg,#59c0ff,#164a6b)" },
    { title:"Wikipedia",    url:"https://www.wikipedia.org",   pill:"Web",  art:"linear-gradient(135deg,#6b7280,#2a2e38)" },
    { title:"Settings",     url:"#",                           pill:"System",art:"linear-gradient(135deg,#8a8f9e,#33363f)" },
  ]},
};

/* =======================================================================
   Clock
   ======================================================================= */
function tick(){
  const d=new Date();
  let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,"0");
  const ampm = h>=12?"PM":"AM"; let hh=h%12; if(hh===0) hh=12;
  document.getElementById("time").innerHTML = hh+":"+m+'<span class="ampm">'+ampm+'</span>';
  document.getElementById("date").textContent =
    d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
}
tick(); setInterval(tick,1000*20); // 20s is plenty for minute precision

/* =======================================================================
   Weather (Open-Meteo, no API key)
   ======================================================================= */
const WMAP = {
  0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
  45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Drizzle"],
  61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],
  71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["❄️","Snow grains"],
  80:["🌦️","Showers"],81:["🌧️","Showers"],82:["⛈️","Violent showers"],
  85:["🌨️","Snow showers"],86:["🌨️","Snow showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm"],99:["⛈️","Thunderstorm"]
};
async function loadWeather(){
  const c=CONFIG.weather;
  document.getElementById("wCity").textContent=c.city;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`+
            `&current=temperature_2m,weather_code&temperature_unit=${c.unit}&timezone=auto`;
    const r=await fetch(u); const j=await r.json();
    const t=Math.round(j.current.temperature_2m);
    const [ico,txt]=WMAP[j.current.weather_code]||["🌡️","—"];
    document.getElementById("wIco").textContent=ico;
    document.getElementById("wTemp").textContent=t+"°";
    document.getElementById("wMeta").textContent=txt;
  }catch(e){
    document.getElementById("wIco").textContent="🌡️";
    document.getElementById("wTemp").textContent="—°";
    document.getElementById("wMeta").textContent="Weather unavailable";
  }
}
loadWeather(); setInterval(loadWeather,1000*60*15);

/* =======================================================================
   Build tiles + rails
   ======================================================================= */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

function buildApps(){
  const root=document.getElementById("apps");
  CONFIG.apps.forEach((a,i)=>{
    const t=el("div","tile focusable");
    t.style.setProperty("--tglow",a.tint+"66");
    t.dataset.url=a.url;
    t.appendChild(el("div","glow"));
    const brand=el("div","brand",a.glyph);
    brand.style.setProperty("--tbg",a.tint+"26");
    brand.style.color=a.tint;
    const txt=el("div");
    txt.appendChild(el("div","label",a.name));
    txt.appendChild(el("div","sub",a.sub));
    t.appendChild(brand); t.appendChild(txt);
    root.appendChild(t);
  });
}
function buildRail(id,cfg){
  const root=document.getElementById(id);
  cfg.items.forEach(it=>{
    const c=el("div","card focusable");
    c.dataset.url=it.url;
    const art=el("div","art"); art.style.background=it.art;
    c.appendChild(art); c.appendChild(el("div","shade"));
    if(it.pill) c.appendChild(el("div","pill",it.pill));
    c.appendChild(el("div","ttl",it.title));
    root.appendChild(c);
  });
}
buildApps();
document.getElementById("rail1-title").textContent=CONFIG.rail1.title;
document.getElementById("rail2-title").textContent=CONFIG.rail2.title;
buildRail("rail1",CONFIG.rail1);
buildRail("rail2",CONFIG.rail2);

/* =======================================================================
   D-pad / remote focus engine
   ======================================================================= */
const rows=[...document.querySelectorAll("[data-row]")].map(r=>[...r.querySelectorAll(".focusable")]);
let rI=0, cI=0;

function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function render(){
  document.querySelectorAll(".focusable.foc").forEach(e=>e.classList.remove("foc"));
  const node=rows[rI] && rows[rI][cI];
  if(!node) return;
  node.classList.add("foc");
  node.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}
function move(dr,dc){
  if(dr!==0){ rI=clamp(rI+dr,0,rows.length-1); cI=clamp(cI,0,rows[rI].length-1); }
  if(dc!==0){ cI=clamp(cI+dc,0,rows[rI].length-1); }
  render();
}
function activate(){
  const node=rows[rI] && rows[rI][cI];
  if(!node) return;
  const url=node.dataset.url;
  if(url && url!=="#"){
    node.animate([{transform:"scale(1.08)"},{transform:"scale(1.0)"},{transform:"scale(1.08)"}],{duration:180});
    window.location.href=url;
  }
}
window.addEventListener("keydown",e=>{
  switch(e.key){
    case "ArrowUp":    move(-1,0); e.preventDefault(); break;
    case "ArrowDown":  move( 1,0); e.preventDefault(); break;
    case "ArrowLeft":  move(0,-1); e.preventDefault(); break;
    case "ArrowRight": move(0, 1); e.preventDefault(); break;
    case "Enter": case " ": activate(); e.preventDefault(); break;
    case "Backspace": case "Escape": rI=0;cI=0;render(); e.preventDefault(); break;
  }
});
/* Mouse support for desktop preview */
document.querySelectorAll(".focusable").forEach((n)=>{
  n.addEventListener("mouseenter",()=>{
    rows.forEach((row,ri)=>{const ci=row.indexOf(n);if(ci>-1){rI=ri;cI=ci;render();}});
  });
  n.addEventListener("click",activate);
});
render();
</script>
</body>
</html>
