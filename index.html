<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aurora — TV Launcher</title>
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --bg-0:#07070b;
    --ink:#f6f8ff;
    --ink-dim:#c3c9dc;
    --ink-faint:#8b92a8;
    --accent:#8fe6ff;
    --glass:rgba(18,20,30,0.42);
    --glass-item:rgba(255,255,255,0.14);
    --stroke:rgba(255,255,255,0.14);
    --focus:#ffffff;
    --safe:3vw;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:"Inter","SF Pro Display",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:.2px;user-select:none;
  }

  /* ---------- Background ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg-0)}
  .photo{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;
         opacity:0;transition:opacity 1s var(--ease)}
  .photo.show{opacity:1}
  .scrim{position:absolute;inset:0;background:
      radial-gradient(85% 60% at 100% 0%, rgba(2,3,8,.60), transparent 58%),
      linear-gradient(180deg,rgba(2,3,8,.45) 0%,rgba(2,3,8,.18) 20%,rgba(2,3,8,.05) 45%,rgba(2,3,8,.34) 72%,rgba(2,3,8,.80) 100%)}
  .grain{position:absolute;inset:0;opacity:.035;background-image:radial-gradient(#fff .5px,transparent .6px);
         background-size:3px 3px;mix-blend-mode:overlay}

  /* ---------- Top-right clock ---------- */
  .topright{position:fixed;z-index:2;top:var(--safe);right:var(--safe);text-align:right;
            text-shadow:0 2px 18px rgba(0,0,0,.5)}
  .time{font-size:5.6vw;font-weight:300;line-height:.95;letter-spacing:1px;color:#eaf7ff;
        font-variant-numeric:tabular-nums}
  .date{margin-top:.3vw;font-size:1.7vw;font-weight:600;color:var(--ink)}
  .wx{margin-top:.5vw;font-size:1.3vw;font-weight:600;color:var(--ink-dim);display:flex;gap:.5vw;
      justify-content:flex-end;align-items:center}
  .wx .ico{font-size:1.5vw;line-height:1}

  /* ---------- Bottom dock ---------- */
  .dockwrap{position:fixed;z-index:2;left:0;right:0;bottom:calc(var(--safe) * .9);
            display:flex;justify-content:center;
            padding-left:max(16px,env(safe-area-inset-left,0px));
            padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dock{display:flex;align-items:stretch;gap:.4vw;max-width:100%;
        background:var(--glass);border:1px solid var(--stroke);border-radius:26px;
        padding:.7vw 1.1vw;backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
        box-shadow:0 2vw 5vw rgba(0,0,0,.5)}
  .dockitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45vw;
            padding:.85vw 1.35vw;border-radius:18px;cursor:pointer;min-width:6vw;
            transition:transform .22s var(--ease),background .22s var(--ease),box-shadow .22s var(--ease)}
  .dockitem .ic{width:2.5vw;height:2.5vw;color:var(--ink);display:grid;place-items:center}
  .dockitem .ic svg{width:100%;height:100%}
  .dockitem .ic .letter{font-size:2.1vw;font-weight:800;line-height:1}
  .dockitem .lbl{font-size:1.02vw;font-weight:600;color:var(--ink-dim);white-space:nowrap;
                 transition:color .22s var(--ease)}
  .sep{width:1px;align-self:center;height:4.2vw;background:var(--stroke);margin:0 .5vw}

  .focusable{outline:none}
  .dockitem.foc{background:var(--glass-item);transform:translateY(-.25vw);
                box-shadow:0 0 0 .14vw rgba(255,255,255,.85), 0 1.4vw 3vw rgba(0,0,0,.45)}
  .dockitem.foc .ic{color:#fff}
  .dockitem.foc .lbl{color:#fff}

  /* fallback without backdrop-filter (older TV browsers) */
  @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
    .dock{background:rgba(14,16,24,.82)}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
    .photo{transition:none!important}
  }
</style>
</head>
<body>
  <div class="bg"><div class="photo" id="bgA"></div><div class="photo" id="bgB"></div><div class="scrim"></div><div class="grain"></div></div>

  <div class="topright">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">—</div>
    <div class="wx" id="wx"><span class="ico" id="wIco">◌</span><span id="wText">Loading…</span></div>
  </div>

  <div class="dockwrap">
    <div class="dock" id="dock"></div>
  </div>

<script>
/* =======================================================================
   CONFIG — edit these to change apps, wallpapers and location.
   ======================================================================= */
const CONFIG = {
  // Background slideshow: cycles automatically with a crossfade and shuffles each load.
  // Add/remove any image file or URL. bg.svg / bg2.svg (aurora art) are still in the repo.
  rotateSeconds:45,
  backgrounds:[
    "photo1.jpg","photo2.jpg",
    "land02.jpg","land06.jpg","land07.jpg","land09.jpg",
    "city02.jpg","city04.jpg","city06.jpg","city09.jpg",
    "art01.jpg","art02.jpg","art05.jpg","art06.jpg","art10.jpg",
    "sky01.jpg","sky03.jpg","sky05.jpg","sky07.jpg"
  ],

  // Weather (Open-Meteo, no key). Default = Accra, Ghana.
  weather:{ lat:5.5600, lon:-0.2050, city:"Accra", unit:"celsius" },

  // Dock apps, left to right. icon = key in ICONS below (else the first letter is shown).
  apps:[
    { name:"Netflix",     url:"https://www.netflix.com",    icon:"netflix" },
    { name:"YouTube",     url:"https://www.youtube.com/tv", icon:"youtube" },
    { name:"Prime Video", url:"https://www.primevideo.com", icon:"prime"   },
    { name:"Spotify",     url:"https://open.spotify.com",   icon:"spotify" },
  ],
};

/* ---------- Line icons (monochrome, currentColor) ---------- */
const ICONS = {
  netflix:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18M6 3l12 18M18 3v18"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4.5"/><path d="M10.5 9l4.5 3-4.5 3z" fill="currentColor" stroke="none"/></svg>',
  prime:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M10.5 9.5l4 2.5-4 2.5z" fill="currentColor" stroke="none"/></svg>',
  spotify:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="18" r="2.4"/><circle cx="17.5" cy="16" r="2.4"/><path d="M9.4 18V7l10.1-2v11"/><path d="M9.4 9.2l10.1-2"/></svg>',
  apps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  wallpaper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 18l5-5 3.5 3.5L16 13l4 4"/></svg>',
};

/* =======================================================================
   Clock (24-hour) + date
   ======================================================================= */
function tick(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  document.getElementById("time").textContent=hh+":"+mm;
  document.getElementById("date").textContent=
    d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick,15000);

/* =======================================================================
   Weather
   ======================================================================= */
const WMAP={0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
  45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Drizzle"],
  61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],
  71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],80:["🌦️","Showers"],81:["🌧️","Showers"],
  82:["⛈️","Violent showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm"],99:["⛈️","Thunderstorm"]};
async function loadWeather(){
  const c=CONFIG.weather;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`+
            `&current=temperature_2m,weather_code&temperature_unit=${c.unit}&timezone=auto`;
    const j=await (await fetch(u)).json();
    const t=Math.round(j.current.temperature_2m);
    const [ico,txt]=WMAP[j.current.weather_code]||["🌡️","—"];
    document.getElementById("wIco").textContent=ico;
    document.getElementById("wText").textContent=t+"°  "+txt+"  ·  "+c.city;
  }catch(e){
    document.getElementById("wIco").textContent="🌡️";
    document.getElementById("wText").textContent=c.city;
  }
}
loadWeather(); setInterval(loadWeather,900000);

/* =======================================================================
   Background (wallpaper) with persistence + toggle
   ======================================================================= */
const ROTATE_MS=(CONFIG.rotateSeconds||45)*1000;
const bgList=CONFIG.backgrounds.slice();
for(let k=bgList.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[bgList[k],bgList[j]]=[bgList[j],bgList[k]];}
const layers=[document.getElementById("bgA"),document.getElementById("bgB")];
let bgIdx=0, active=0, bgTimer=null;
function setLayer(el,url){el.style.backgroundImage='url("'+url+'")';}
function preload(url){const im=new Image();im.src=url;}
function showBg(idx){
  idx=((idx%bgList.length)+bgList.length)%bgList.length;
  bgIdx=idx;
  const next=1-active;
  setLayer(layers[next],bgList[idx]);
  void layers[next].offsetWidth;            // reflow so the fade runs
  layers[next].classList.add("show");
  layers[active].classList.remove("show");
  active=next;
  preload(bgList[(idx+1)%bgList.length]);
}
function nextBg(){ showBg(bgIdx+1); resetBgTimer(); }
function resetBgTimer(){ if(bgTimer) clearInterval(bgTimer); bgTimer=setInterval(()=>showBg(bgIdx+1),ROTATE_MS); }
/* show the first image, then rotate */
setLayer(layers[0],bgList[0]); layers[0].classList.add("show"); preload(bgList[1%bgList.length]);
resetBgTimer();

/* =======================================================================
   Build the dock
   ======================================================================= */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function iconMarkup(a){
  if(a.icon && ICONS[a.icon]) return ICONS[a.icon];
  return '<span class="letter">'+(a.name?a.name[0].toUpperCase():"?")+'</span>';
}
function addDockItem(opts){
  const it=el("div","dockitem focusable");
  it.appendChild(el("div","ic",opts.icon));
  it.appendChild(el("div","lbl",opts.label));
  if(opts.action==="open"){ it.dataset.url=opts.url; }
  it.dataset.action=opts.action;
  document.getElementById("dock").appendChild(it);
  return it;
}
const dock=document.getElementById("dock");
CONFIG.apps.forEach(a=>addDockItem({icon:iconMarkup(a),label:a.name,action:"open",url:a.url}));
dock.appendChild(el("div","sep"));
addDockItem({icon:ICONS.wallpaper,label:"Wallpaper",action:"wallpaper"});

/* =======================================================================
   D-pad / remote
   ======================================================================= */
const items=[...document.querySelectorAll(".dockitem")];
let i=0;
function render(){
  document.querySelectorAll(".dockitem.foc").forEach(e=>e.classList.remove("foc"));
  const n=items[i]; if(!n) return;
  n.classList.add("foc");
  n.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}
function activate(){
  const n=items[i]; if(!n) return;
  if(n.dataset.action==="wallpaper"){ nextBg(); return; }
  const url=n.dataset.url;
  if(url){ n.animate([{transform:"translateY(-.25vw) scale(1)"},{transform:"translateY(-.25vw) scale(.94)"},{transform:"translateY(-.25vw) scale(1)"}],{duration:160}); window.location.href=url; }
}
window.addEventListener("keydown",e=>{
  switch(e.key){
    case "ArrowLeft":  i=Math.max(0,i-1); render(); e.preventDefault(); break;
    case "ArrowRight": i=Math.min(items.length-1,i+1); render(); e.preventDefault(); break;
    case "Enter": case " ": activate(); e.preventDefault(); break;
    case "Backspace": case "Escape": i=0; render(); e.preventDefault(); break;
  }
});
items.forEach((n,idx)=>{ n.addEventListener("mouseenter",()=>{i=idx;render();}); n.addEventListener("click",activate); });
render();
</script>
</body>
</html>
