<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a1e"/>
      <stop offset="0.45" stop-color="#2a1030"/>
      <stop offset="0.8" stop-color="#512033"/>
      <stop offset="1" stop-color="#1a0a14"/>
    </linearGradient>
    <radialGradient id="g2a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9e5e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff9e5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5f8f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff5f8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a6bff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9a6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd89e" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff9e5e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9e5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="s2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="120"/></filter>
    <filter id="s2b" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160a12"/><stop offset="1" stop-color="#080309"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky2)"/>

  <g filter="url(#s2)" opacity="0.9">
    <ellipse cx="1350" cy="340" rx="640" ry="260" fill="url(#g2a)"/>
    <ellipse cx="560" cy="300" rx="520" ry="220" fill="url(#g2c)"/>
  </g>
  <g filter="url(#s2b)" opacity="0.85">
    <ellipse cx="300" cy="520" rx="360" ry="170" fill="url(#g2b)"/>
    <ellipse cx="1650" cy="560" rx="380" ry="180" fill="url(#g2b)"/>
    <ellipse cx="980" cy="200" rx="520" ry="150" fill="url(#g2a)"/>
  </g>

  <!-- soft sun -->
  <circle cx="1300" cy="430" r="220" fill="url(#sun2)" filter="url(#s2b)"/>

  <g fill="#ffffff">
    <circle cx="180" cy="110" r="1.4" opacity="0.7"/><circle cx="520" cy="150" r="1" opacity="0.5"/>
    <circle cx="760" cy="90" r="1.2" opacity="0.6"/><circle cx="240" cy="260" r="1" opacity="0.45"/>
    <circle cx="430" cy="360" r="1.1" opacity="0.5"/><circle cx="120" cy="440" r="1" opacity="0.5"/>
    <circle cx="90" cy="200" r="1" opacity="0.45"/><circle cx="660" cy="250" r="0.9" opacity="0.4"/>
  </g>

  <path d="M0,1080 L0,905 C260,870 460,935 700,905 C960,872 1140,820 1380,860 C1600,896 1760,852 1920,888 L1920,1080 Z" fill="url(#ridge2)" opacity="0.95"/>
  <path d="M0,1080 L0,980 C300,960 540,1002 840,978 C1140,954 1400,920 1680,958 L1920,972 L1920,1080 Z" fill="#050208"/>
</svg>
