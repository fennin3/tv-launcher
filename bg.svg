<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060d"/>
      <stop offset="0.45" stop-color="#081225"/>
      <stop offset="0.78" stop-color="#0b2236"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#43e0c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#43e0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a9c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff7a9c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040609"/>
      <stop offset="1" stop-color="#01030a"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- aurora ribbons / nebula glows (blurred) -->
  <g filter="url(#softer)" opacity="0.9">
    <ellipse cx="620" cy="300" rx="560" ry="230" fill="url(#glowTeal)"/>
    <ellipse cx="1300" cy="230" rx="620" ry="250" fill="url(#glowBlue)"/>
  </g>
  <g filter="url(#soft)" opacity="0.85">
    <ellipse cx="1500" cy="440" rx="420" ry="180" fill="url(#glowViolet)"/>
    <ellipse cx="300" cy="520" rx="380" ry="170" fill="url(#glowBlue)"/>
    <ellipse cx="980" cy="160" rx="520" ry="150" fill="url(#glowTeal)"/>
    <ellipse cx="1750" cy="720" rx="360" ry="200" fill="url(#glowRose)"/>
  </g>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="140" cy="90" r="1.6" opacity="0.9"/><circle cx="420" cy="140" r="1.1" opacity="0.6"/>
    <circle cx="700" cy="70" r="1.3" opacity="0.8"/><circle cx="910" cy="120" r="1" opacity="0.5"/>
    <circle cx="1180" cy="90" r="1.5" opacity="0.85"/><circle cx="1450" cy="150" r="1" opacity="0.5"/>
    <circle cx="1680" cy="80" r="1.4" opacity="0.8"/><circle cx="1850" cy="160" r="1.1" opacity="0.6"/>
    <circle cx="240" cy="240" r="1" opacity="0.5"/><circle cx="560" cy="300" r="1.2" opacity="0.7"/>
    <circle cx="820" cy="260" r="0.9" opacity="0.45"/><circle cx="1050" cy="330" r="1.3" opacity="0.7"/>
    <circle cx="1320" cy="280" r="1" opacity="0.5"/><circle cx="1600" cy="340" r="1.4" opacity="0.8"/>
    <circle cx="1790" cy="300" r="1" opacity="0.5"/><circle cx="90" cy="420" r="1.2" opacity="0.65"/>
    <circle cx="380" cy="470" r="1" opacity="0.5"/><circle cx="1500" cy="520" r="1.1" opacity="0.6"/>
    <circle cx="1720" cy="470" r="1" opacity="0.5"/><circle cx="1000" cy="500" r="1.3" opacity="0.7"/>
    <circle cx="670" cy="540" r="0.9" opacity="0.4"/><circle cx="1260" cy="560" r="1" opacity="0.5"/>
  </g>

  <!-- horizon ridge -->
  <path d="M0,1080 L0,900 C240,860 420,930 650,905 C900,878 1080,815 1330,860 C1560,900 1740,845 1920,885 L1920,1080 Z" fill="url(#ridge)" opacity="0.95"/>
  <path d="M0,1080 L0,975 C280,955 520,1000 820,975 C1120,950 1380,915 1660,955 C1780,972 1860,962 1920,968 L1920,1080 Z" fill="#010206"/>
</svg>
